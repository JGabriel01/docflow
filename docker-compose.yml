services:
  db:
    image: mysql:8.0
    container_name: docflow_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: docflow
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: docflow_app
    restart: always
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      BASE_URL: http://localhost:3000
      DATABASE_URL: mysql://root:root@db:3306/docflow
      SESSION_SECRET: docflow_session_secret_super_secure_key_12345
      ENCRYPTION_KEY: f748968a35e54c9e22435a3b2ac07b2e068be160197c83f3120bc9622bf699c0
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
